name: Mathverse Web (Pygbag)

on:
  push:
    branches:
      - main
      - mathverse-finalizacion
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mathverse-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build browser version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pygbag and pygame-ce
        run: python -m pip install --upgrade pip pygbag==0.9.3 pygame-ce

      - name: Package Mathverse for WebAssembly
        run: python -m pygbag --build --ume_block=0 --app_name "Mathverse" --title "Mathverse — El Desafío de los 5 Reinos" .

      - name: Verify generated website
        run: |
          test -s build/web/index.html
          echo "Pygbag generated build/web/index.html"
          du -sh build/web

      - name: Upload browser build for testing
        uses: actions/upload-artifact@v4
        with:
          name: mathverse-web-build
          path: build/web/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download browser build
        uses: actions/download-artifact@v4
        with:
          name: mathverse-web-build
          path: build/web

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
