name: MATEMIA Web (Pygbag)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pygame y Pygbag
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame-ce pygbag

      - name: Preparar una copia web de MATEMIA
        run: python web/prepare_pygbag.py

      - name: Compilar para navegador
        working-directory: .pygbag_src
        run: python -m pygbag --build .

      - name: Verificar que se generó la página
        run: test -s .pygbag_src/build/web/index.html

      - name: Subir archivos de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pygbag_src/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
